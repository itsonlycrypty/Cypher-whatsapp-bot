<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CYPHER · Pair</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0a0a0f; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: #1a1a2e; padding: 30px; border-radius: 20px; max-width: 400px; width: 100%; text-align: center; }
        .logo { font-size: 28px; font-weight: bold; background: linear-gradient(135deg, #a855f7, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-group { display: flex; background: #0e0e16; border-radius: 12px; padding: 4px; margin: 20px 0; border: 1px solid #2a2a3e; }
        .input-group span { padding: 0 12px; color: #8b8ba3; }
        .input-group input { background: transparent; border: none; padding: 14px; width: 100%; color: #fff; font-size: 16px; outline: none; }
        .btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #8b5cf6, #6366f1); border: none; border-radius: 12px; color: #fff; font-weight: bold; font-size: 17px; cursor: pointer; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #result { margin-top: 20px; padding: 16px; background: #0e0e16; border-radius: 12px; min-height: 60px; border: 1px dashed #2a2a3e; }
        .code { font-size: 36px; font-weight: bold; color: #fbbf24; letter-spacing: 4px; }
        .error { color: #f87171; }
        .info { color: #8b8ba3; }
        .spinner { border: 3px solid #2a2a3e; border-top: 3px solid #8b5cf6; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">CYPHER v1</div>
        <p style="color: #8b8ba3; margin-bottom: 20px;">Pair Your WhatsApp Number</p>
        <div class="input-group">
            <span>+</span>
            <input type="tel" id="phone" placeholder="2347016334222" />
        </div>
        <button class="btn" id="getCodeBtn">🔐 GENERATE PAIRING CODE</button>
        <div id="result"><span class="info">Enter your number and tap generate</span></div>
    </div>
    <script>
        const btn = document.getElementById('getCodeBtn');
        const phoneInput = document.getElementById('phone');
        const resultDiv = document.getElementById('result');

        btn.addEventListener('click', async () => {
            const phone = phoneInput.value.replace(/\D/g, '');
            if (!phone || phone.length < 10) {
                resultDiv.innerHTML = `<span class="error">❌ Please enter a valid full number.</span>`;
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Generating...';
            resultDiv.innerHTML = `<div class="spinner"></div>`;

            try {
                const res = await fetch(`/api/pair?phone=${phone}`);
                const data = await res.json();

                if (data.success) {
                    resultDiv.innerHTML = `
                        <span style="color: #8b8ba3;">✅ Your 8‑digit code:</span>
                        <div class="code">${data.code}</div>
                        <span style="font-size:12px; color:#6b6b83;">Enter in WhatsApp → Linked Devices</span>
                    `;
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ ${data.error || 'Unknown error'}</span>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<span class="error">❌ ${err.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '🔐 GENERATE PAIRING CODE';
            }
        });
    </script>
</body>
</html>
